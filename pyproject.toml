[project]
name = "cartflow"
version = "0.1.0"
description = "Pipeline ETL data e-commerce Olist ke data warehouse star schema di DuckDB"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "kagglehub>=1.0.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
